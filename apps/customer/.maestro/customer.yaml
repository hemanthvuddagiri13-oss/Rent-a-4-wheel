appId: com.renta4wheel.customer.acceptance
env:
  PHONE: "+12025550101"
---
- launchApp:
    clearState: true
# The AOSP CI launcher's own ANR may cover the tested app after cold boot.
# Match only Quickstep; an ANR from Rent A 4Wheel must still fail the journey.
- runFlow:
    when:
      visible: "Quickstep isn't responding"
    commands:
      - tapOn: "Close app"
- takeScreenshot: native-launch
- assertVisible: "Your next drive starts here."
- takeScreenshot: native-home
- runFlow: email-navigation.yaml
- scrollUntilVisible:
    element:
      id: home-sign-in
    direction: UP
    centerElement: true
- tapOn:
    id: home-sign-in
- assertVisible:
    id: phone-sign-in-screen
- scrollUntilVisible:
    element: "Use verified email instead"
    direction: DOWN
# Email code-verification coverage only: the isolated CI fixture pre-seeds this
# code. Request-code returns generic accepted; no new email delivery is tested.
- tapOn: "Use verified email instead"
- assertVisible: "Sign in with linked email"
- tapOn:
    id: "input-Email address"
- inputText: "native-customer@example.test"
- assertVisible:
    id: "input-Email address"
    text: "native-customer@example[.]test"
- runFlow: dismiss-keyboard.yaml
- tapOn:
    text: "Send sign-in code"
    enabled: true
- scrollUntilVisible:
    element:
      id: "input-Six-digit email code"
    direction: DOWN
- tapOn:
    id: "input-Six-digit email code"
- inputText: "123456"
- runFlow: dismiss-keyboard.yaml
- scrollUntilVisible:
    element: "Verify & sign in"
    direction: DOWN
- tapOn:
    text: "Verify & sign in"
    enabled: true
- runFlow:
    when:
      platform: iOS
    commands:
      # Measured CI cold Keychain write: 49s, before the HTTP request.
      # Await actual completion; retain the assertion and the app's HTTP bound.
      - extendedWaitUntil:
          visible: "Your next drive starts here."
          timeout: 75000
- assertVisible: "Your next drive starts here."
- scrollUntilVisible:
    element: "Account & devices"
    direction: DOWN
    centerElement: true
- tapOn: "Account & devices"
- assertVisible: "Login & recovery"
# Device rows change layout after the Account query resolves. Await its real
# result before locating logout so a stale pre-load coordinate cannot hit a card.
- extendedWaitUntil:
    visible: "Revoke .* device"
    timeout: 20000
- scrollUntilVisible:
    element: "Log out this device"
    direction: DOWN
    centerElement: true
- tapOn: "Log out this device"
- assertVisible: "Your next drive starts here."
- scrollUntilVisible:
    element:
      id: home-sign-in
    direction: UP
    centerElement: true
- tapOn:
    id: home-sign-in
- assertVisible:
    id: phone-sign-in-screen
- scrollUntilVisible:
    element:
      id: "input-Mobile phone number"
    direction: UP
- tapOn:
    id: "input-Mobile phone number"
- runFlow:
    when:
      platform: Android
    commands:
      - inputText: "${PHONE}"
- runFlow:
    when:
      platform: iOS
    commands:
      # Synchronize every character with the native field. Maestro's burst
      # injection can drop everything after its first character on iOS.
      - evalScript: ${output.phoneIndex = 0}
      - repeat:
          times: ${PHONE.length}
          commands:
            # XCTest may lose first-responder focus between injections. Restore
            # it explicitly; keep the exact prefix assertion after every digit.
            - tapOn:
                id: "input-Mobile phone number"
            - inputText: ${PHONE.charAt(output.phoneIndex)}
            - evalScript: ${output.phoneIndex = output.phoneIndex + 1}
            - assertVisible:
                id: "input-Mobile phone number"
                text: "[+]${PHONE.slice(1, output.phoneIndex)}"
- assertVisible:
    id: "input-Mobile phone number"
    text: "[+]${PHONE.slice(1)}"
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "Done editing"
- tapOn: "Send text code"
- scrollUntilVisible:
    element:
      id: "input-Six-digit text code"
    direction: DOWN
- tapOn:
    id: "input-Six-digit text code"
- inputText: "123456"
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "Done editing"
- scrollUntilVisible:
    element: "Verify phone & continue"
    direction: DOWN
- tapOn: "Verify phone & continue"
- runFlow:
    when:
      platform: iOS
    commands:
      # Measured CI cold Keychain write: 49s, before the HTTP request.
      # Await actual completion; retain the assertion and the app's HTTP bound.
      - extendedWaitUntil:
          visible: "Your next drive starts here."
          timeout: 75000
- assertVisible: "Your next drive starts here."
- scrollUntilVisible:
    element: "View Synthetic Acceptance Car"
    direction: DOWN
- tapOn: "View Synthetic Acceptance Car"
# Do not aim at the disabled pre-load button: the listing response inserts
# content above it and changes its position. Require the loaded vehicle first.
- assertVisible: "Synthetic Acceptance Car"
- scrollUntilVisible:
    element:
      text: "Check availability"
      enabled: true
    direction: DOWN
- tapOn:
    text: "Check availability"
    enabled: true
- assertVisible: "Available at last check. A hold is required to reserve these dates."
- takeScreenshot: native-availability
- tapOn: "Hold dates & review price"
- scrollUntilVisible:
    element: "Server price breakdown"
    direction: DOWN
    centerElement: true
- waitForAnimationToEnd
- assertVisible: "Server price breakdown"
- assertVisible: "Vehicle:.*"
- takeScreenshot: native-price
- scrollUntilVisible:
    element: "Documents & checkout preparation"
    direction: DOWN
    centerElement: true
- tapOn: "Documents & checkout preparation"
- assertVisible: "Prepare your reservation"
# Identity entry blocks screenshots intentionally. Do not capture this screen.
- scrollUntilVisible:
    element:
      id: "input-First name"
    direction: DOWN
- assertVisible:
    id: "input-First name"
# Traverse the five-page form through a semantic waypoint instead of racing a
# single scroll command's deadline. Keep the final agreement assertion intact.
- scrollUntilVisible:
    element: "Choose selfie with license"
    direction: DOWN
- assertVisible: "Choose selfie with license"
- scrollUntilVisible:
    element: "I have read and accept this agreement"
    direction: DOWN
- tapOn: "I have read and accept this agreement"
- assertVisible: "Agreement selected — tap to withdraw"
- tapOn: "Agreement selected — tap to withdraw"
- runFlow: back.yaml
- runFlow: back.yaml
- runFlow: back.yaml
- scrollUntilVisible:
    element: "Your trips"
    direction: UP
- tapOn: "Your trips"
- assertVisible: "NATIVE-SYNTHETIC-TRIP"
- assertVisible: "Open trip to verify payment and deposit."
- assertNotVisible: "Server status: CONFIRMED"
- takeScreenshot: native-trips
- tapOn: "View trip NATIVE-SYNTHETIC-TRIP"
- assertVisible: "Reservation is not financially confirmed"
- assertNotVisible: "Reservation confirmed by server"
- takeScreenshot: native-payment-status
- runFlow: restart-upload.yaml
- scrollUntilVisible:
    element: "Message your host"
    direction: DOWN
- tapOn: "Message your host"
- runFlow: rejected-message.yaml
- tapOn:
    id: "input-Message"
- inputText: "Synthetic native acceptance message"
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "Done editing"
- tapOn: "Send message"
- runFlow: restart-message.yaml
- assertVisible: "Synthetic native acceptance message"
- takeScreenshot: native-message
- runFlow:
    when:
      platform: Android
    commands:
      - back
      - back
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "Back"
      - tapOn: "Back"
      - tapOn: "Back"
- scrollUntilVisible:
    element: "Notices"
    direction: DOWN
- tapOn: "Notices"
- assertVisible: "Trip update: CHECKOUT HOLD CREATED"
- takeScreenshot: native-notices
- runFlow: back.yaml
- scrollUntilVisible:
    element: "Support & cases"
    direction: DOWN
- tapOn: "Support & cases"
- tapOn:
    id: "input-Request title"
- inputText: "Synthetic native support request"
- runFlow: dismiss-keyboard.yaml
- tapOn:
    id: "input-Describe what happened"
- inputText: "Synthetic acceptance request with no private evidence."
- runFlow: dismiss-keyboard.yaml
- scrollUntilVisible:
    element: "Open support request"
    direction: DOWN
- tapOn: "Open support request"
- extendedWaitUntil:
    visible:
      id: case-detail-title
      text: "Synthetic native support request"
    timeout: 60000
- assertNotVisible:
    id: "input-Request title"
- assertVisible: "Synthetic acceptance request with no private evidence."
- tapOn:
    id: "input-Reply to case"
- inputText: "Synthetic follow-up."
- assertVisible: "Synthetic follow-up."
- runFlow: dismiss-keyboard.yaml
- scrollUntilVisible:
    element: "Send case reply"
    direction: DOWN
- tapOn: "Send case reply"
- assertVisible: "CUSTOMER_REPLY.*"
- scrollUntilVisible:
    element: "Synthetic follow-up."
    direction: UP
- assertVisible: "Synthetic follow-up."
- takeScreenshot: native-case
- runFlow: back.yaml
# Prove Case -> Support before issuing the next native Back action. A completed
# driver tap alone did not prove this transition in the preserved iOS failure.
- assertVisible: "Support"
- runFlow: back.yaml
- scrollUntilVisible:
    element: "Your next drive starts here."
    direction: UP
- assertVisible: "Your next drive starts here."
- runFlow: restart-cancellation.yaml
- scrollUntilVisible:
    element: "Account & devices"
    direction: DOWN
- tapOn: "Account & devices"
# Device rows change layout after the Account query resolves. Await its real
# result before locating logout so a stale pre-load coordinate cannot hit a card.
- extendedWaitUntil:
    visible: "Revoke .* device"
    timeout: 20000
- scrollUntilVisible:
    element: "Log out this device"
    direction: DOWN
    centerElement: true
- assertVisible:
    text: "Log out this device"
    enabled: true
- tapOn: "Log out this device"
- assertVisible: "Your next drive starts here."
- tapOn: "Your trips"
- assertVisible: "Welcome to your next trip."
