appId: com.renta4wheel.host.acceptance
---
- scrollUntilVisible:
    element: "Choose ${LABEL} condition photo"
    direction: DOWN
- tapOn: "Choose ${LABEL} condition photo"
- runFlow:
    when:
      visible: "Allow Full Access"
    commands:
      - tapOn: "Allow Full Access"
- runFlow:
    when:
      visible: "Allow all"
    commands:
      - tapOn: "Allow all"
- tapOn:
    text: "Photo[ ,].*"
    index: ${INDEX}
- runFlow:
    when:
      visible: "Add"
    commands:
      - tapOn: "Add"
- scrollUntilVisible:
    element: "Upload ${LABEL} condition photo"
    direction: DOWN
- tapOn: "Upload ${LABEL} condition photo"
- runFlow:
    when:
      true: ${INTERRUPTED == "true"}
    commands:
      # Await the interrupted-body error; never silently skip the retry assertion.
      - extendedWaitUntil:
          visible: "${LABEL} condition photo: Upload not confirmed.*"
          timeout: 25000
      - tapOn: "Upload ${LABEL} condition photo"
- assertVisible: "${LABEL} condition photo: Upload completed and scanned. Eligibility review may still be pending."
