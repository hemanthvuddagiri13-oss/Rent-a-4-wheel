appId: com.renta4wheel.host.acceptance
---
- runFlow: choose-condition.yaml
- runFlow:
    when:
      true: ${INTERRUPTED == "true"}
    commands:
      # Await the interrupted-body error; never silently skip the retry assertion.
      - extendedWaitUntil:
          visible: "${LABEL} condition photo: Upload not confirmed.*"
          timeout: 200000
      - runFlow: restart-return-upload.yaml
# Each send runs me (recovery scope) -> me -> initializeUpload -> me -> finalizeUpload. The
# transport bounds are 4 * 20s JSON + 120s binary/scanner. Await the terminal UI
# state within that pipeline bound; do not rely on the default 20s assertion.
# The same bound applies above to the deliberate interrupted-response error.
- extendedWaitUntil:
    visible: "${LABEL} condition photo: Upload completed and scanned. Eligibility review may still be pending."
    timeout: 200000
- assertVisible: "${LABEL} condition photo: Upload completed and scanned. Eligibility review may still be pending."
