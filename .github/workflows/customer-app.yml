name: Customer native app
on:
  push:
    branches: [codex/phase-7b-customer-app]
  pull_request:
permissions:
  contents: read
concurrency:
  group: customer-native-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rent_a_4wheel_test
        ports: [5432:5432]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rent_a_4wheel_test
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rent_a_4wheel_test
      AUTH_SECRET: synthetic-native-ci-only-not-a-deployment-secret
      CRON_SECRET: synthetic-native-ci-cron-only
      APP_ENV: test
      NATIVE_ACCEPTANCE: '1'
      EXPO_PUBLIC_API_ORIGIN: http://localhost:3000
      CI: 'true'
      ALLOW_DEV_PAYMENT_SIMULATION: 'false'
      MOBILE_SMS_PROVIDER: fixture
      MOBILE_SMS_FIXTURE_CODE: '123456'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/customer/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci && npm --prefix apps/customer ci
      - run: npm --prefix apps/customer run typecheck && npm run lint && npm --prefix apps/customer audit --audit-level=low
      - run: npm run db:deploy && npm run db:seed
      - name: Build production API backend
        run: npm run build
      - name: Generate and build Android release app
        working-directory: apps/customer
        run: |
          npx expo prebuild --platform android --no-install
          cd android
          ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon
      - name: Prepare synthetic API backend
        run: |
          npx tsx tests/helpers/customer-native-fixture.ts
          npm run dev -- --hostname 127.0.0.1 --port 3001 > /tmp/native-api.log 2>&1 &
          CUSTOMER_RECOVERY=true node scripts/host-native-proxy.mjs > /tmp/native-proxy.log 2>&1 &
          curl --retry 30 --retry-delay 1 --retry-connrefused --fail http://localhost:3000/api/health/live
          curl --fail --max-time 180 http://localhost:3000/api/v1/mobile/vehicles > /dev/null
          curl --fail --max-time 180 -H 'Content-Type: application/json' --data '{"email":"compile-only@example.test"}' http://localhost:3000/api/v1/mobile/auth/request-code > /dev/null
          curl -fsSL https://get.maestro.mobile.dev | bash
      - name: KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Actual Android application journeys
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          script: bash scripts/customer-android-journeys.sh
      - name: Sanitized API timing evidence
        if: always()
        run: node scripts/native-safe-telemetry.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: customer-android-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/
            apps/customer/android/app/build/outputs/apk/release/app-release.apk
  ios:
    runs-on: macos-26
    timeout-minutes: 75
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      AUTH_SECRET: synthetic-native-ci-only-not-a-deployment-secret
      CRON_SECRET: synthetic-native-ci-cron-only
      APP_ENV: test
      NATIVE_ACCEPTANCE: '1'
      EXPO_PUBLIC_API_ORIGIN: http://localhost:3000
      CI: 'true'
      ALLOW_DEV_PAYMENT_SIMULATION: 'false'
      MOBILE_SMS_PROVIDER: fixture
      MOBILE_SMS_FIXTURE_CODE: '123456'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/customer/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci && npm --prefix apps/customer ci
      - name: Pin iOS tools and fresh simulator
        run: |
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          mkdir -p artifacts
          curl --fail --location --output "$RUNNER_TEMP/maestro.zip" https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.10.0/maestro.zip
          echo "29b675e10cc12080e445e9bfb2e2b4e4dfb9c0f2e30d5884120d258b5e1cd991  $RUNNER_TEMP/maestro.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP/pinned-maestro"
          echo "MAESTRO_BIN=$RUNNER_TEMP/pinned-maestro/maestro/bin/maestro" >> "$GITHUB_ENV"
          xcrun simctl list runtimes -j > artifacts/ios-runtimes.json
          RUNTIME=$(node scripts/native-ios-target.mjs artifacts/ios-runtimes.json)
          DEVICE=$(xcrun simctl create RentA4WheelCustomerAcceptance com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro "$RUNTIME")
          echo "DEVICE=$DEVICE" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          echo "Xcode=26.6 iOS=26.5 Maestro=2.10.0 Device=$DEVICE" > artifacts/ios-toolchain.txt
      - name: Disposable PostgreSQL
        run: |
          brew install postgresql@17
          brew services start postgresql@17
          echo "$(brew --prefix postgresql@17)/bin" >> "$GITHUB_PATH"
          echo "DATABASE_URL=postgresql://$(whoami)@localhost:5432/rent_a_4wheel_test" >> "$GITHUB_ENV"
          echo "DIRECT_DATABASE_URL=postgresql://$(whoami)@localhost:5432/rent_a_4wheel_test" >> "$GITHUB_ENV"
      - run: |
          for attempt in {1..30}; do pg_isready && break; sleep 1; done
          createdb rent_a_4wheel_test
          npm run db:deploy
          npm run db:seed
      - name: Build production API backend
        run: npm run build
      - name: Build actual iOS simulator release app
        working-directory: apps/customer
        run: |
          npx expo prebuild --platform ios
          # Simulator ad-hoc signing retains application/keychain entitlements.
          # No Apple account or distribution certificate is used.
          xcodebuild -workspace ios/RentA4Wheel.xcworkspace -scheme RentA4Wheel -configuration Release -sdk iphonesimulator -derivedDataPath build CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- build
          codesign --verify --deep --strict build/Build/Products/Release-iphonesimulator/RentA4Wheel.app
          # Simulator entitlements are linked into __TEXT, not the device signature.
          ENTITLEMENTS=build/Build/Intermediates.noindex/RentA4Wheel.build/Release-iphonesimulator/RentA4Wheel.build/RentA4Wheel.app-Simulated.xcent
          test "$(/usr/libexec/PlistBuddy -c 'Print :application-identifier' "$ENTITLEMENTS")" = 'FAKETEAMID.com.renta4wheel.customer.acceptance'
          strings build/Build/Products/Release-iphonesimulator/RentA4Wheel.app/RentA4Wheel | grep -F 'FAKETEAMID.com.renta4wheel.customer.acceptance'
      - name: Actual iOS application journeys
        run: |
          npm run dev -- --hostname 127.0.0.1 --port 3001 > /tmp/native-api.log 2>&1 &
          CUSTOMER_RECOVERY=true node scripts/host-native-proxy.mjs > /tmp/native-proxy.log 2>&1 &
          curl --retry 30 --retry-delay 1 --retry-connrefused --fail http://localhost:3000/api/health/live
          curl --fail --max-time 180 http://localhost:3000/api/v1/mobile/vehicles > /dev/null
          curl --fail --max-time 180 -H 'Content-Type: application/json' --data '{"email":"compile-only@example.test"}' http://localhost:3000/api/v1/mobile/auth/request-code > /dev/null
          xcrun simctl install "$DEVICE" apps/customer/build/Build/Products/Release-iphonesimulator/RentA4Wheel.app
          npx tsx tests/helpers/customer-native-fixture.ts
          mkdir -p artifacts
          trap 'xcrun simctl io "$DEVICE" screenshot artifacts/ios-final.png; xcrun simctl spawn "$DEVICE" log show --last 3m --predicate '\''process == "RentA4Wheel"'\'' --style compact > artifacts/ios-runtime.txt' EXIT
          python3 -c 'import subprocess,sys; subprocess.run(sys.argv[1:], check=True, timeout=1200)' "$MAESTRO_BIN" --device "$DEVICE" test apps/customer/.maestro/customer.yaml --test-output-dir "$PWD/artifacts/maestro" --format junit --output artifacts/ios-results.xml
          npx tsx tests/helpers/customer-native-fixture.ts --assert
      - name: Sanitized API timing evidence
        if: always()
        run: node scripts/native-safe-telemetry.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: customer-ios-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/
            apps/customer/build/Build/Products/Release-iphonesimulator/*.app
