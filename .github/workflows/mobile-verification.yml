name: Mobile API verification
on:
  push:
    branches: [codex/phase-7a-mobile-api-auth, codex/phase-7b-customer-app, codex/phase-7c-host-app]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rent_a_4wheel_test
        ports: [5432:5432]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/rent_a_4wheel_test
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/rent_a_4wheel_test
      MIGRATION_CONNECTION_MODE: direct
      AUTH_SECRET: ci-only-not-a-deployment-secret
      NEXTAUTH_URL: http://localhost:3000
      CRON_SECRET: ci-only-cron-secret
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:deploy
      - run: npm run db:seed
      - run: npx prisma generate && npx next typegen && npm run typecheck
      - run: npm run lint
      - name: Physical-device trial configuration guard
        run: node --test tests/native-device-trial-gate.test.mjs tests/native-staging-probe.test.mjs
      - name: OpenAPI validation and generated-client drift
        run: npx tsx scripts/generate-mobile-contract.ts --check && node scripts/validate-mobile-openapi.mjs
      - name: Dependency security audit
        run: npm audit --audit-level=low
      - name: Mobile security and HTTP suites five times
        run: |
          for run in 1 2 3 4 5; do
            echo "Mobile security repetition $run"
            npx vitest run tests/mobile-security.test.ts tests/mobile-contract.test.ts tests/mobile-migration.test.ts tests/mobile-sms-provider.test.ts tests/customer-session.test.ts tests/mobile-recovery.test.ts tests/secure-recovery-store.test.ts tests/mobile-telemetry.test.ts || exit 1
          done
      - name: OpenAPI and client artifacts (no runtime payloads)
        uses: actions/upload-artifact@v4
        with:
          name: mobile-contract-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            docs/api/mobile-v1.openapi.json
            packages/mobile-client/src
